<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中联智慧工厂设备监控</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #0B1F3A;
    color: #E0E8F0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── 顶部标题栏 ── */
  .header {
    background: linear-gradient(90deg, #0D2444, #12305A, #0D2444);
    border-bottom: 2px solid #00E5FF;
    padding: 18px 0;
    text-align: center;
    position: relative;
  }
  .header h1 {
    font-size: 26px;
    letter-spacing: 8px;
    color: #00E5FF;
    text-shadow: 0 0 12px rgba(0, 229, 255, 0.5);
  }
  .header .subtitle {
    font-size: 13px;
    color: #5A8FA8;
    margin-top: 4px;
    letter-spacing: 3px;
  }
  /* 标题栏左右装饰线 */
  .header::before, .header::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #00E5FF);
  }
  .header::before { left: 30px; }
  .header::after  { right: 30px; background: linear-gradient(270deg, transparent, #00E5FF); }

  /* ── 主体布局 ── */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 220px 1fr 280px;
    gap: 20px;
    padding: 20px 24px;
  }

  /* ── 通用面板 ── */
  .panel {
    background: rgba(13, 36, 68, 0.85);
    border: 1px solid #1A3C66;
    border-radius: 8px;
    overflow: hidden;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: #00E5FF;
    padding: 14px 16px 10px;
    border-bottom: 1px solid #1A3C66;
    letter-spacing: 2px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00E5FF;
    box-shadow: 0 0 6px #00E5FF;
  }

  /* ── 左侧 · 设备列表 ── */
  .device-list { padding: 10px 0; }
  .device-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    cursor: pointer;
    transition: background 0.25s;
    border-left: 3px solid transparent;
  }
  .device-item:hover { background: rgba(0, 229, 255, 0.06); }
  .device-item.active {
    background: rgba(0, 229, 255, 0.1);
    border-left-color: #00E5FF;
  }
  .device-icon {
    width: 38px; height: 38px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    background: rgba(0, 229, 255, 0.08);
    border: 1px solid #1A3C66;
    flex-shrink: 0;
  }
  .device-name { font-size: 15px; font-weight: 500; }
  .device-id   { font-size: 11px; color: #5A8FA8; margin-top: 2px; }

  /* ── 中间 · 状态卡片区 ── */
  .status-area {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 16px;
  }
  .status-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
  }
  .status-card {
    border-radius: 8px;
    padding: 22px 18px;
    text-align: center;
    position: relative;
    overflow: hidden;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .status-card:hover {
    transform: translateY(-3px);
  }
  .status-card .label { font-size: 13px; margin-bottom: 10px; letter-spacing: 1px; }
  .status-card .value { font-size: 36px; font-weight: 700; }
  .status-card .unit  { font-size: 13px; margin-left: 2px; font-weight: 400; }
  .status-card .trend { font-size: 12px; margin-top: 8px; }

  /* 运行卡 */
  .card-running {
    background: linear-gradient(135deg, #0A2E4C, #0E3D5E);
    border: 1px solid #00E5FF;
    box-shadow: 0 0 16px rgba(0, 229, 255, 0.15);
  }
  .card-running .label { color: #5AC8D8; }
  .card-running .value { color: #00E5FF; }
  .card-running .trend { color: #4DB8CC; }

  /* 待机卡 */
  .card-standby {
    background: linear-gradient(135deg, #1A2A3A, #22334A);
    border: 1px solid #4A6A8A;
    box-shadow: 0 0 10px rgba(74, 106, 138, 0.15);
  }
  .card-standby .label { color: #8AA0B8; }
  .card-standby .value { color: #C0D0E0; }
  .card-standby .trend { color: #8AA0B8; }

  /* 报警卡 */
  .card-alarm {
    background: linear-gradient(135deg, #2A1A0A, #3D2510);
    border: 1px solid #FF6D00;
    box-shadow: 0 0 16px rgba(255, 109, 0, 0.15);
  }
  .card-alarm .label { color: #FF9E40; }
  .card-alarm .value { color: #FF6D00; }
  .card-alarm .trend { color: #CC7A20; }
  .card-alarm.pulse {
    animation: alarmPulse 0.8s ease-in-out 3;
  }

  @keyframes alarmPulse {
    0%, 100% { box-shadow: 0 0 16px rgba(255, 109, 0, 0.15); }
    50%      { box-shadow: 0 0 30px rgba(255, 109, 0, 0.5); }
  }

  /* ── 中间 · 设备运行参数 ── */
  .params-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  .param-box {
    background: rgba(10, 30, 55, 0.7);
    border: 1px solid #1A3C66;
    border-radius: 6px;
    padding: 14px 12px;
    text-align: center;
  }
  .param-box .p-label { font-size: 12px; color: #5A8FA8; margin-bottom: 6px; }
  .param-box .p-value { font-size: 22px; font-weight: 600; color: #00E5FF; }
  .param-box .p-unit  { font-size: 11px; color: #5A8FA8; margin-left: 2px; }
  .param-box .p-bar {
    margin-top: 8px;
    height: 4px;
    border-radius: 2px;
    background: #1A3C66;
    overflow: hidden;
  }
  .param-box .p-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, #00E5FF, #00B8D4);
    transition: width 0.6s ease;
  }

  /* ── 右侧 · 报警列表 ── */
  .alarm-panel { display: flex; flex-direction: column; }
  .alarm-list {
    flex: 1;
    padding: 8px 0;
    overflow-y: auto;
    max-height: 520px;
  }
  .alarm-item {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(26, 60, 102, 0.5);
    transition: background 0.3s;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .alarm-item.highlight {
    background: rgba(255, 109, 0, 0.12);
    border-left: 3px solid #FF6D00;
  }
  .alarm-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .alarm-dot.level-high   { background: #FF6D00; box-shadow: 0 0 6px #FF6D00; }
  .alarm-dot.level-medium { background: #FFB300; box-shadow: 0 0 4px #FFB300; }
  .alarm-dot.level-low    { background: #4DB8CC; box-shadow: 0 0 4px #4DB8CC; }
  .alarm-content { flex: 1; }
  .alarm-msg  { font-size: 13px; line-height: 1.5; }
  .alarm-meta { font-size: 11px; color: #5A8FA8; margin-top: 4px; display: flex; gap: 12px; }
  .alarm-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
  }
  .badge-high   { background: rgba(255,109,0,0.2); color: #FF6D00; }
  .badge-medium { background: rgba(255,179,0,0.2); color: #FFB300; }
  .badge-low    { background: rgba(0,229,255,0.15); color: #00E5FF; }

  .alarm-count {
    padding: 12px 16px;
    border-top: 1px solid #1A3C66;
    font-size: 12px;
    color: #5A8FA8;
    display: flex;
    justify-content: space-between;
  }
  .alarm-count span { color: #FF6D00; font-weight: 600; }

  /* ── 底部按钮栏 ── */
  .footer {
    padding: 16px 24px;
    text-align: center;
    border-top: 1px solid #1A3C66;
  }
  .btn-refresh {
    background: linear-gradient(135deg, #00697A, #00838F);
    color: #E0F7FA;
    border: 1px solid #00ACC1;
    border-radius: 6px;
    padding: 12px 48px;
    font-size: 15px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
    overflow: hidden;
  }
  .btn-refresh:hover {
    background: linear-gradient(135deg, #00838F, #00ACC1);
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
    transform: translateY(-1px);
  }
  .btn-refresh:active {
    transform: translateY(0);
    box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
  }
  .btn-refresh .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(0, 229, 255, 0.35);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }

  /* ── 时间标签 ── */
  .time-tag {
    position: absolute;
    right: 30px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    color: #5A8FA8;
    letter-spacing: 1px;
  }

  /* ── 滚动条 ── */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1A3C66; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #2A5C86; }

  /* ── 刷新动画 ── */
  .fade-update {
    animation: fadeUpdate 0.5s ease;
  }
  @keyframes fadeUpdate {
    0%   { opacity: 0.4; transform: scale(0.96); }
    100% { opacity: 1;   transform: scale(1); }
  }
</style>
</head>
<body>

<!-- 顶部标题栏 -->
<div class="header">
  <h1>中联智慧工厂设备监控</h1>
  <div class="subtitle">ZOOMLION SMART FACTORY EQUIPMENT MONITORING</div>
  <div class="time-tag" id="timeTag"></div>
</div>

<!-- 主体 -->
<div class="main">

  <!-- 左侧 · 设备列表 -->
  <div class="panel">
    <div class="panel-title"><span class="dot"></span>设备列表</div>
    <div class="device-list" id="deviceList">
      <div class="device-item active" data-device="pump" onclick="selectDevice(this)">
        <div class="device-icon">🏗</div>
        <div>
          <div class="device-name">泵车</div>
          <div class="device-id">ZLJ-5419THB · #01</div>
        </div>
      </div>
      <div class="device-item" data-device="crane" onclick="selectDevice(this)">
        <div class="device-icon">🏗</div>
        <div>
          <div class="device-name">起重机</div>
          <div class="device-id">QY-25V532 · #02</div>
        </div>
      </div>
      <div class="device-item" data-device="excavator" onclick="selectDevice(this)">
        <div class="device-icon">⛏</div>
        <div>
          <div class="device-name">挖掘机</div>
          <div class="device-id">ZE-210E · #03</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 中间 · 状态区 -->
  <div class="status-area">
    <!-- 状态卡片 -->
    <div class="status-cards" id="statusCards">
      <div class="status-card card-running">
        <div class="label">● 运行中</div>
        <div class="value" id="valRunning">12<span class="unit">台</span></div>
        <div class="trend" id="trendRunning">▲ 较昨日 +2</div>
      </div>
      <div class="status-card card-standby">
        <div class="label">◉ 待机中</div>
        <div class="value" id="valStandby">5<span class="unit">台</span></div>
        <div class="trend" id="trendStandby">— 持平</div>
      </div>
      <div class="status-card card-alarm" id="cardAlarm">
        <div class="label">▲ 报警</div>
        <div class="value" id="valAlarm">3<span class="unit">台</span></div>
        <div class="trend" id="trendAlarm">▲ 较昨日 +1</div>
      </div>
    </div>

    <!-- 运行参数面板 -->
    <div class="panel">
      <div class="panel-title"><span class="dot"></span>运行参数</div>
      <div class="params-grid" style="padding: 16px;">
        <div class="param-box">
          <div class="p-label">发动机转速</div>
          <div class="p-value" id="pRpm">1850<span class="p-unit">rpm</span></div>
          <div class="p-bar"><div class="p-bar-fill" id="barRpm" style="width:74%"></div></div>
        </div>
        <div class="param-box">
          <div class="p-label">液压油温</div>
          <div class="p-value" id="pTemp">62<span class="p-unit">℃</span></div>
          <div class="p-bar"><div class="p-bar-fill" id="barTemp" style="width:55%"></div></div>
        </div>
        <div class="param-box">
          <div class="p-label">系统压力</div>
          <div class="p-value" id="pPressure">28.5<span class="p-unit">MPa</span></div>
          <div class="p-bar"><div class="p-bar-fill" id="barPressure" style="width:68%"></div></div>
        </div>
        <div class="param-box">
          <div class="p-label">燃油量</div>
          <div class="p-value" id="pFuel">76<span class="p-unit">%</span></div>
          <div class="p-bar"><div class="p-bar-fill" id="barFuel" style="width:76%"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧 · 报警信息列表 -->
  <div class="panel alarm-panel">
    <div class="panel-title"><span class="dot" style="background:#FF6D00;box-shadow:0 0 6px #FF6D00"></span>报警信息</div>
    <div class="alarm-list" id="alarmList"></div>
    <div class="alarm-count">
      <span>今日报警总数：<span id="alarmTotal">3</span></span>
      <span>未处理：<span id="alarmPending">2</span></span>
    </div>
  </div>

</div>

<!-- 底部按钮 -->
<div class="footer">
  <button class="btn-refresh" id="btnRefresh" onclick="refreshStatus(event)">
    ⟳ 刷新状态
  </button>
</div>

<script>
(function () {
  /* ── 报警信息库 ── */
  var alarmPool = [
    { msg: "泵车 #01 液压油温超限报警",      device: "泵车",    level: "high"   },
    { msg: "起重机 #02 载荷传感器信号异常",   device: "起重机",  level: "high"   },
    { msg: "挖掘机 #03 发动机水温偏高",       device: "挖掘机",  level: "medium" },
    { msg: "泵车 #01 臂架振动值偏大",         device: "泵车",    level: "medium" },
    { msg: "起重机 #02 回转机构异响报警",     device: "起重机",  level: "high"   },
    { msg: "挖掘机 #03 燃油滤芯堵塞预警",     device: "挖掘机",  level: "low"    },
    { msg: "泵车 #01 支腿压力不均报警",       device: "泵车",    level: "high"   },
    { msg: "起重机 #02 风速超限预警",         device: "起重机",  level: "medium" },
    { msg: "挖掘机 #03 行走马达温度偏高",     device: "挖掘机",  level: "low"    },
    { msg: "泵车 #01 混凝土活塞密封磨损预警", device: "泵车",    level: "medium" },
    { msg: "起重机 #02 力矩限制器触发",       device: "起重机",  level: "high"   },
    { msg: "挖掘机 #03 主泵压力波动",         device: "挖掘机",  level: "medium" }
  ];

  var levelLabel = { high: "严重", medium: "警告", low: "提示" };
  var levelBadge = { high: "badge-high", medium: "badge-medium", low: "badge-low" };
  var levelDot   = { high: "level-high", medium: "level-medium", low: "level-low" };

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function formatTime(d) {
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) +
      " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  /* ── 渲染报警列表 ── */
  function renderAlarms(highlight) {
    var list = document.getElementById("alarmList");
    /* 随机选 3~6 条 */
    var count = 3 + Math.floor(Math.random() * 4);
    var shuffled = alarmPool.slice().sort(function () { return Math.random() - 0.5; });
    var selected = shuffled.slice(0, count);
    var now = new Date();
    var html = "";
    for (var i = 0; i < selected.length; i++) {
      var a = selected[i];
      var t = new Date(now.getTime() - i * (60000 + Math.floor(Math.random() * 300000)));
      var hl = highlight && i === 0 ? " highlight" : "";
      html += '<div class="alarm-item' + hl + '">' +
        '<div class="alarm-dot ' + levelDot[a.level] + '"></div>' +
        '<div class="alarm-content">' +
          '<div class="alarm-msg">' + a.msg + '</div>' +
          '<div class="alarm-meta">' +
            '<span class="alarm-badge ' + levelBadge[a.level] + '">' + levelLabel[a.level] + '</span>' +
            '<span>' + a.device + '</span>' +
            '<span>' + pad(t.getHours()) + ":" + pad(t.getMinutes()) + "</span>" +
          "</div>" +
        "</div>" +
      "</div>";
    }
    list.innerHTML = html;

    /* 更新统计 */
    document.getElementById("alarmTotal").textContent = count;
    var pending = Math.floor(Math.random() * count);
    document.getElementById("alarmPending").textContent = pending;
    return count;
  }

  /* ── 更新状态卡片 ── */
  function updateCards() {
    var running = 8 + Math.floor(Math.random() * 10);
    var standby = 2 + Math.floor(Math.random() * 6);
    var alarm   = 1 + Math.floor(Math.random() * 5);

    var diffR = Math.floor(Math.random() * 5) - 2;
    var diffA = Math.floor(Math.random() * 3) - 1;

    document.getElementById("valRunning").innerHTML = running + '<span class="unit">台</span>';
    document.getElementById("valStandby").innerHTML = standby + '<span class="unit">台</span>';
    document.getElementById("valAlarm").innerHTML   = alarm   + '<span class="unit">台</span>';

    document.getElementById("trendRunning").textContent = diffR >= 0 ? "▲ 较昨日 +" + diffR : "▼ 较昨日 " + diffR;
    document.getElementById("trendStandby").textContent = "— 持平";
    document.getElementById("trendAlarm").textContent   = diffA >= 0 ? "▲ 较昨日 +" + diffA : "▼ 较昨日 " + diffA;

    /* 报警卡脉冲 */
    var cardAlarm = document.getElementById("cardAlarm");
    cardAlarm.classList.remove("pulse");
    void cardAlarm.offsetWidth;
    cardAlarm.classList.add("pulse");

    /* 运行参数随机 */
    var rpm  = 1600 + Math.floor(Math.random() * 600);
    var temp = 50  + Math.floor(Math.random() * 30);
    var pres = (22  + Math.random() * 12).toFixed(1);
    var fuel = 40  + Math.floor(Math.random() * 55);

    document.getElementById("pRpm").innerHTML      = rpm  + '<span class="p-unit">rpm</span>';
    document.getElementById("pTemp").innerHTML      = temp + '<span class="p-unit">℃</span>';
    document.getElementById("pPressure").innerHTML  = pres + '<span class="p-unit">MPa</span>';
    document.getElementById("pFuel").innerHTML      = fuel + '<span class="p-unit">%</span>';

    document.getElementById("barRpm").style.width      = Math.min(100, (rpm / 2500) * 100).toFixed(0)  + "%";
    document.getElementById("barTemp").style.width     = Math.min(100, (temp / 100) * 100).toFixed(0)  + "%";
    document.getElementById("barPressure").style.width = Math.min(100, (pres / 40) * 100).toFixed(0)   + "%";
    document.getElementById("barFuel").style.width     = fuel + "%";

    /* 动画 */
    var cards = document.querySelectorAll(".status-card, .param-box");
    for (var i = 0; i < cards.length; i++) {
      cards[i].classList.remove("fade-update");
      void cards[i].offsetWidth;
      cards[i].classList.add("fade-update");
    }
  }

  /* ── 时钟 ── */
  function tick() {
    document.getElementById("timeTag").textContent = formatTime(new Date());
  }
  setInterval(tick, 1000);
  tick();

  /* ── 初始报警列表 ── */
  renderAlarms(false);

  /* ── 全局 API ── */
  window.refreshStatus = function (e) {
    /* 水波纹 */
    var btn = document.getElementById("btnRefresh");
    var rect = btn.getBoundingClientRect();
    var ripple = document.createElement("span");
    ripple.className = "ripple";
    var size = Math.max(rect.width, rect.height);
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = (e.clientX - rect.left - size / 2) + "px";
    ripple.style.top  = (e.clientY - rect.top  - size / 2) + "px";
    btn.appendChild(ripple);
    setTimeout(function () { ripple.remove(); }, 600);

    updateCards();
    renderAlarms(true);
  };

  window.selectDevice = function (el) {
    var items = document.querySelectorAll(".device-item");
    for (var i = 0; i < items.length; i++) items[i].classList.remove("active");
    el.classList.add("active");
    /* 切换设备时也刷新参数 */
    updateCards();
    renderAlarms(true);
  };
})();
